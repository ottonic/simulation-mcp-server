name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

# Auto-cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, required gate. The platform matrix below is the broader cross-platform
  # signal; it needs the native solver toolchain, so it is not the required check.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting, lint, types, and tests
        run: just check

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  platform-check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-15
          - name: Windows x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      # setup-uv publishes no floating major tag that resolves, so the exact
      # version is required here.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: uvx ruff check worker
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "src/**/*.ts" "tests/**/*.ts" "scripts/**/*.mjs" "*.json"
      - run: npm test

      - name: Read pinned Elmer revision
        id: elmer-revision
        shell: bash
        run: |
          revision=$(node -e 'const lock=JSON.parse(require("node:fs").readFileSync("flake.lock")); const input=lock.nodes.root.inputs.elmer; console.log(lock.nodes[input].locked.rev)')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Install Linux runtime build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake ninja-build libopenblas-dev liblapack-dev libtbb-dev libglu1-mesa libgl1 libxrender1 libxcursor1 libxfixes3 libxext6 libxft2 libfontconfig1 libxinerama1 libx11-6

      - name: Install macOS runtime build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gcc openblas tbb ninja
          compiler=$(node -e 'const fs=require("node:fs"); const p=process.argv[1]; const names=fs.readdirSync(p).filter(n=>/^gfortran-[0-9]+$/.test(n)).sort((a,b)=>Number(a.slice(9))-Number(b.slice(9))); console.log(names.length ? p+"/"+names.at(-1) : "")' "$(brew --prefix gcc)/bin")
          test -n "$compiler"
          echo "FC=$compiler" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas):$(brew --prefix tbb)" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-tbb

      - name: Fingerprint native runtime toolchain
        if: runner.os != 'Windows'
        id: runtime-toolchain
        shell: bash
        run: |
          {
            cmake --version | head -1
            "${FC:-gfortran}" --version | head -1
            pkg-config --modversion openblas || echo openblas-version-unknown
            pkg-config --modversion tbb || echo tbb-version-unknown
          } | tee "$RUNNER_TEMP/runtime-toolchain.txt"
          echo "fingerprint=$(sha256sum "$RUNNER_TEMP/runtime-toolchain.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Fingerprint Windows runtime toolchain
        if: runner.os == 'Windows'
        id: runtime-toolchain-windows
        shell: msys2 {0}
        run: |
          {
            cmake --version | head -1
            gfortran --version | head -1
            pkg-config --modversion openblas || echo openblas-version-unknown
            pkg-config --modversion tbb || echo tbb-version-unknown
          } | tee "$RUNNER_TEMP/runtime-toolchain.txt"
          echo "fingerprint=$(sha256sum "$RUNNER_TEMP/runtime-toolchain.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore native Elmer runtime cache
        id: elmer-cache
        uses: actions/cache/restore@v6
        with:
          path: .runtime-cache/elmer
          key: simulation-elmer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'scripts/build-elmer.sh') }}-${{ steps.runtime-toolchain.outputs.fingerprint || steps.runtime-toolchain-windows.outputs.fingerprint }}

      - name: Build pinned Elmer runtime on cache miss
        if: steps.elmer-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        env:
          ELMER_REVISION: ${{ steps.elmer-revision.outputs.revision }}
        run: bash scripts/ci-build-elmer.sh

      - name: Build pinned Elmer runtime on Windows cache miss
        if: steps.elmer-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        env:
          ELMER_REVISION: ${{ steps.elmer-revision.outputs.revision }}
        run: bash scripts/ci-build-elmer.sh

      - name: Add Elmer to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.runtime-cache/elmer/bin" >> "$GITHUB_PATH"

      - name: Add MSYS2 runtime DLLs to PATH
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "$(cygpath -w "$MINGW_PREFIX/bin")" >> "$(cygpath -u "$GITHUB_PATH")"

      - name: Save native Elmer runtime cache
        if: steps.elmer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .runtime-cache/elmer
          key: simulation-elmer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'scripts/build-elmer.sh') }}-${{ steps.runtime-toolchain.outputs.fingerprint || steps.runtime-toolchain-windows.outputs.fingerprint }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/runtime-requirements.txt

      - name: Install Gmsh runtime wheel
        run: python -m pip install --no-deps -r scripts/runtime-requirements.txt

      # The bar fixture is a build product (`just fixture`), gitignored and not
      # present in a fresh checkout; the integration suite reads it.
      - name: Generate the analytic bar fixture
        run: python tests/fixtures/generate_bar.py

      - name: Run full analytic thermal smoke test
        env:
          SIMULATION_PYTHON: python
          SIMULATION_ELMERGRID: ${{ runner.os == 'Windows' && format('{0}/.runtime-cache/elmer/bin/ElmerGrid.exe', github.workspace) || format('{0}/.runtime-cache/elmer/bin/ElmerGrid', github.workspace) }}
          SIMULATION_ELMERSOLVER: ${{ runner.os == 'Windows' && format('{0}/.runtime-cache/elmer/bin/ElmerSolver.exe', github.workspace) || format('{0}/.runtime-cache/elmer/bin/ElmerSolver', github.workspace) }}
        run: npm run test:integration

      - name: Pack and install the published package
        shell: bash
        run: |
          tarball=$(npm pack --pack-destination . | tail -1)
          npm install --prefix smoke --no-save --ignore-scripts "./$tarball"

      - name: Launch packed MCP server and inspect STEP fixture
        env:
          SIMULATION_SMOKE_ROOT: smoke
          SIMULATION_PYTHON: python
          SIMULATION_ELMERGRID: ${{ runner.os == 'Windows' && format('{0}/.runtime-cache/elmer/bin/ElmerGrid.exe', github.workspace) || format('{0}/.runtime-cache/elmer/bin/ElmerGrid', github.workspace) }}
          SIMULATION_ELMERSOLVER: ${{ runner.os == 'Windows' && format('{0}/.runtime-cache/elmer/bin/ElmerSolver.exe', github.workspace) || format('{0}/.runtime-cache/elmer/bin/ElmerSolver', github.workspace) }}
        run: node scripts/smoke-packed-mcp.mjs

      - name: Upload tested native Elmer runtime
        uses: actions/upload-artifact@v7
        with:
          name: simulation-elmer-${{ runner.os }}-${{ runner.arch }}
          path: .runtime-cache/elmer
          if-no-files-found: error
          retention-days: 7
